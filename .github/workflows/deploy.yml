name: Deploy to Hostinger

# ESTE ES EL BLOQUE QUE FALTABA (El gatillo)
on:
  push:
    branches:
      - main # Cambie 'main' por 'master' si su rama principal se llama así

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Obtener el código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Compilar el proyecto
      - name: Compilar el proyecto (Build)
        run: npm run build

      # 5. Preparar la llave SSH
      - name: Preparar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # 6. Desplegar con rsync
      - name: Deploy via rsync over SSH
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git*' \
            --exclude='node_modules' \
            ./dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}
