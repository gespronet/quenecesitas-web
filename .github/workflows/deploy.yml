name: Build para Hostinger

on:
  push:
    branches:
      - main # Cambie a 'master' si su rama principal se llama así

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1. Obtener el código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Compilar el proyecto (Esto genera la carpeta dist)
      - name: Compilar el proyecto
        run: npm run build

      # 5. Guardar la carpeta dist como un archivo descargable
      - name: Empaquetar y guardar dist
        uses: actions/upload-artifact@v4
        with:
          name: archivos-para-hostinger
          path: ./dist/
          retention-days: 7 # El archivo zip se guardará en GitHub por 7 días
